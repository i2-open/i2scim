name: Build and Attest

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [published]

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run MongoDB-backed tests
        # The Mongo provider tests run against an ephemeral mongo:8.0 container
        # started by Quarkus Dev Services; MongoPending*StoreTest and
        # SignalsDurabilityTest start their own mongo:8.0 via Testcontainers.
        # Either way the ubuntu-latest runner supplies the Docker daemon. The
        # -Dtest filter scopes the run to these classes; core and client modules
        # match nothing, so surefire.failIfNoSpecifiedTests=false keeps them green.
        run: mvn -B test -Dtest='Mongo*,RiscMongoPreImageTest,SignalsDurabilityTest' -Dsurefire.failIfNoSpecifiedTests=false

      - name: Build and Package with Maven
        run: mvn -B package -DskipTests

      - name: Capture build metadata
        id: meta-vars
        run: |
          version=$(mvn -N -q help:evaluate -Dexpression=project.version -DforceStdout)
          {
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest Maven Artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "**/target/*.jar"

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: "**/target/*.jar"
          sbom-path: "target/bom.json"

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: i2scim-server
          file: i2scim-server/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta-vars.outputs.build_date }}

      - name: Attest Docker Image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
