name: Build and Attest

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  release:
    types: [published]

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run test suite
        # Runs the whole reactor's tests (~421 in i2scim-server; core and client
        # carry none). The suite needs only a Docker daemon, which ubuntu-latest
        # supplies: the four MongoProvider-backed test profiles use an ephemeral
        # mongo:8.2 from Quarkus Dev Services, and the signals durability/store tests
        # share a single mongo:8.2 via Testcontainers. Dev Services is OFF by default
        # so the many MemoryProvider-backed tests don't each launch an unused mongo
        # container -- both mechanisms use the same mongo:8.2 tag, so the runner pulls
        # ONE mongo image. No MongoDB on localhost, no OPA server and no Kafka broker
        # are required. Two classes stay excluded in i2scim-server/pom.xml --
        # LoadScimClusterTest (needs a K8s cluster) and SignalsGoSignalsIT (needs a
        # live goSignals server).
        env:
          # The runner is ephemeral and destroyed after the job, so the ryuk reaper
          # buys nothing here -- skip it to avoid starting a reaper container per fork.
          TESTCONTAINERS_RYUK_DISABLED: "true"
          # Skip the one-time Docker-environment probe Testcontainers runs at startup.
          TESTCONTAINERS_CHECKS_DISABLE: "true"
        run: ./mvnw -B test

      - name: Build and Package with Maven
        # Tests already ran in the previous step; -DskipTests just assembles jars.
        run: ./mvnw -B package -DskipTests

      - name: Capture build metadata
        id: meta-vars
        run: |
          version=$(./mvnw -N -q help:evaluate -Dexpression=project.version -DforceStdout)
          {
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Check release tag matches pom version
        # The release's attested jars carry the pom version, and build.sh tags the
        # Docker Hub image with it, so the tag must agree. Bump the pom first.
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.meta-vars.outputs.version }}
        run: |
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match pom version ${VERSION}"
            exit 1
          fi

      - name: Attest Maven Artifacts
        # PR builds publish nothing, and fork PRs never receive an OIDC token
        # (id-token: write is withheld), so attestation would fail there.
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "**/target/*.jar"

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v2
        with:
          subject-path: "**/target/*.jar"
          sbom-path: "target/bom.json"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # Validates the Dockerfile only; nothing is pushed. Images are published to
        # Docker Hub by hand with ./build.sh -p.
        uses: docker/build-push-action@v5
        with:
          context: i2scim-server
          file: i2scim-server/src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ steps.meta-vars.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta-vars.outputs.build_date }}
